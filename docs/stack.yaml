project: ame
version: 0.4.0
description: Agent-first, self-hostable learning platform with one owner-scoped learner API.

runtime:
  local_origin: http://localhost:28800
  services:
    postgres: postgres:18
    valkey: valkey:8
    api: rust-axum
    web: nextjs-react
    caddy: caddy:2.10-alpine
  compose:
    development: docker-compose.local.yml
    production: docker-compose.prod.yml

api:
  authenticated_prefix: /api/v1
  public_prefix: /public/v1
  operational_paths: [/healthz, /readyz, /metrics]
  static_public_paths:
    - /public/llms.txt
    - /public/skill.json
    - /public/openapi.yaml
  authentication: learner bearer token or browser session cookie
  agent_model: agents use the same learner-owned API; no agent account or scope layer
  generated_contracts:
    openapi: api/openapi.yaml
    frontend_types: web/src/api/generated/schema.d.ts
    public_manifest: docs/public/skill.json

data:
  database: PostgreSQL 18
  cache: Valkey 8
  migrations: db/migrations/20260719000000_learning_baseline.sql
  policy: fresh 0.3 baseline; no compatibility migration
  durable_resources:
    - learners and login sessions
    - goals, journeys, objectives, and activities
    - versioned questions and assessments
    - attempts, answers, grading, and evidence
    - deep dives, recommendations, mastery, and streak events

verification:
  unit_and_contract: make check
  api_black_box: uv run pytest api_tests -v
  browser: make local-uiux
  full_stack: make dev
  public_contract_source: docs/public/

documentation:
  plan: docs/plans/2026-07-19-agent-first-learning-rework.md
  public_operator_docs: docs/public/
