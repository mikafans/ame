# AME Development Configuration File
# Rate limits effectively disabled for dev testing (10x higher bursts than production)

[server]
port = 28080
production = false
cors_origins = "http://localhost:23000"
log_format = "compact"

[ratelimit]
trusted_proxies = 1

[ratelimit.free]
burst = 1000000
rate = 1000000

[ratelimit.premium]
burst = 1000000
rate = 1000000

[ratelimit.public]
burst = 1000000
period_secs = 2

[ratelimit.export]
burst = 1
period_secs = 60

[ratelimit.cost]
read = 1
write = 5

[batch]
free = 50
premium = 500

[quota.agents]
free = 1
premium = 1000000

[quota.assessments]
free = 1000000
premium = 1000000

[quota.questions]
free = 1000000
premium = 1000000

[login]
# Interactive login (browser auth) TTL in seconds; sliding — refreshed on each
# authenticated request. 3 hours.
ttl_seconds = 10800
