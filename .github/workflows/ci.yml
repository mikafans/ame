name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Install web deps
        run: nix develop -c bash -c 'cd web && bun install --frozen-lockfile'

      - name: fmt-check + lint + test
        run: nix develop -c make check

      - name: openapi + client drift check
        run: nix develop -c bash -c 'cd web && bun run api:check && bun run client:check'
