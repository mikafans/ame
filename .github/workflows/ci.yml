name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Install web deps
        working-directory: web
        run: bun install --frozen-lockfile

      - name: fmt-check + lint + test
        run: make check

      - name: openapi drift check
        working-directory: web
        run: bun run api:check

  db-tests:
    name: db-backed integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ame
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ame"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ame
        run: sqlx migrate run --source db/migrations

      - name: DB integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ame
          AME_RUN_DB_TESTS: "1"
        run: make test-db

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ame
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ame"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ame
        run: sqlx migrate run --source db/migrations

      - name: Install web deps
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Run e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ame
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
