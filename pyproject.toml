[project]
name = "ame-api-tests"
version = "0.2.0"
description = "Black-box HTTP integration tests for the ame API"
requires-python = ">=3.14"
dependencies = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["api_tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".tmp", "web"]

[tool.ruff.lint]
extend-select = ["I"]
