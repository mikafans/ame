# AME Configuration File
# Controls server settings, rate limits, and system tunables.

[server]
port = 28080
production = false
cors_origins = "http://localhost:23000"
log_format = "compact"

[ratelimit]
trusted_proxies = 1

[ratelimit.free]
burst = 60
rate = 1

[ratelimit.premium]
burst = 600
rate = 10

[ratelimit.public]
burst = 10
period_secs = 2

[ratelimit.export]
burst = 1
period_secs = 60

[ratelimit.cost]
read = 1
write = 5

[batch]
free = 50
premium = 500

[login]
# Interactive login (browser auth) TTL in seconds; sliding — refreshed on each
# authenticated request. 3 hours.
ttl_seconds = 10800

[registration]
# open allows first-journey onboarding with an email identifier; password and
# invite require an already authenticated learner session.
mode = "open"
