apiVersion: v1
kind: Service
metadata:
  name: ame-valkey
  namespace: harus-edge
  labels:
    app.kubernetes.io/component: valkey
    app.kubernetes.io/part-of: ame
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: valkey
    app.kubernetes.io/part-of: ame
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ame-valkey
  namespace: harus-edge
  labels:
    app.kubernetes.io/component: valkey
    app.kubernetes.io/part-of: ame
spec:
  # StatefulSet (not Deployment) because Valkey is now the session source of
  # truth, not a throwaway cache — AOF on a PVC must survive a pod restart or
  # every logged-in user is dropped. Single replica, stable local-path volume.
  serviceName: ame-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey
      app.kubernetes.io/part-of: ame
  template:
    metadata:
      labels:
        app.kubernetes.io/component: valkey
        app.kubernetes.io/part-of: ame
    spec:
      containers:
        - name: valkey
          image: mirror.gcr.io/valkey/valkey:9.1.0-alpine
          # AOF persistence: fsync every second (durable within ~1s of a crash,
          # no per-write latency hit). Data dir is the mounted PVC.
          command: ["valkey-server"]
          args:
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "everysec"
            - "--dir"
            - "/data"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
