# ame-platform — single-origin front door (nginx).
#
# Why this exists: the API sets its session cookie as `SameSite=Lax` over plain
# HTTP (it only adds `Secure` when production=true). With web on ame-web.* and
# API on ame-api.* — different sites — the browser won't send that cookie on the
# cross-site fetch the SPA makes, so login "succeeds" but no session sticks.
# Putting both behind ONE origin (this proxy) makes the cookie first-party and
# Lax just works; CORS stops mattering too. The web image is built with
# NEXT_PUBLIC_API_URL="" so all API calls are relative to whatever host serves
# the page — i.e. this front door.
#
#   browser ──▶ ame-platform ──┬─ /api/* + /public/* ─▶ ame-api
#                              └─ /*    ─▶ ame-web
apiVersion: v1
kind: ConfigMap
metadata:
  name: ame-platform-nginx
  namespace: harus-edge
  labels:
    app.kubernetes.io/component: front
    app.kubernetes.io/part-of: ame
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      # API first — same-origin so the ame_token cookie rides API calls.
      # No trailing slash on proxy_pass → the prefix is preserved. Routes moved
      # off a flat /v1/* to /api/v1/* (authenticated) + /public/v1/* (open) in
      # the 0.4.0 refactor (api/src/http/mod.rs nests api_routes at /api and
      # public_routes at /public) — both must be proxied.
      location /api/ {
        proxy_pass http://ame-api.harus-edge.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AME's get_client_ip strips `trusted_proxies` (=2, see ame.toml)
        # right-most hops from X-Forwarded-For. The Cloudflare and nginx hops
        # are the trusted right-most entries; $proxy_add_x_forwarded_for
        # already ends with the real client ($remote_addr); appending
        # $server_addr makes the chain "client, cloudflared, nginx", so
        # stripping two hops yields the real client and any client-supplied XFF stays harmlessly
        # to the left (can't spoof past the trusted hop).
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for, $server_addr";
      }

      location /public/ {
        proxy_pass http://ame-api.harus-edge.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for, $server_addr";
      }

      location / {
        proxy_pass http://ame-web.harus-edge.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ame-platform
  namespace: harus-edge
  labels:
    app.kubernetes.io/component: front
    app.kubernetes.io/part-of: ame
spec:
  # ClusterIP — the one origin users hit over Tailscale:
  # http://ame-platform.harus-edge.svc.cluster.local
  selector:
    app.kubernetes.io/component: front
    app.kubernetes.io/part-of: ame
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ame-platform
  namespace: harus-edge
  labels:
    app.kubernetes.io/component: front
    app.kubernetes.io/part-of: ame
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: front
      app.kubernetes.io/part-of: ame
  template:
    metadata:
      labels:
        app.kubernetes.io/component: front
        app.kubernetes.io/part-of: ame
    spec:
      containers:
        - name: nginx
          image: mirror.gcr.io/library/nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 96Mi
      volumes:
        - name: conf
          configMap:
            name: ame-platform-nginx
            items:
              - key: default.conf
                path: default.conf
