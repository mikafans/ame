apiVersion: v1
kind: Service
metadata:
  name: ame-web
  namespace: harus-edge
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ame
spec:
  # ClusterIP — reached over Tailscale as ame-web.harus-edge.svc.cluster.local
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ame
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ame-web
  namespace: harus-edge
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ame
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: ame
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: ame
    spec:
      containers:
        - name: web
          # NEXT_PUBLIC_API_URL is baked EMPTY at build (build-images.sh) so API
          # calls are relative — the web is served same-origin behind ame-platform
          # (front.yaml). Tag tracks the ame source built by build-images.sh.
          image: azusachino.icu/ame-web:0.4.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
