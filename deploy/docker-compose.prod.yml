# Production-shaped compose stack. Intended for smoke deploys, demos, and CI
# integration testing. Run from the repo root:
#
#   docker compose -f deploy/docker-compose.prod.yml up --build
#
# Override secrets via a sibling deploy/.env file (POSTGRES_PASSWORD, NEXT_PUBLIC_API_URL, ...).

name: ame

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ame}
    volumes:
      # postgres:18 expects the mount at the parent dir (data lives in a subdir).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ame}"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: ame-api:latest
    restart: unless-stopped
    # The api runs embedded migrations on boot (sqlx::migrate!), so no separate
    # migration service is needed.
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      AME_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ame}
      AME_VALKEY_URL: redis://valkey:6379/0
      AME_PRODUCTION: ${AME_PRODUCTION:-1}
      AME_CORS_ORIGINS: ${AME_CORS_ORIGINS:?set AME_CORS_ORIGINS in .env}
      RUST_LOG: ${RUST_LOG:-ame_api=info,tower_http=info,sqlx=warn}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        # Baked into the client bundle at build time — point at the public
        # API URL, not the in-cluster hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: ame-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      AME_HOSTNAME: ${AME_HOSTNAME:-:80}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "${AME_HTTP_PORT:-80}:80"
      - "${AME_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ../docs:/srv/docs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
