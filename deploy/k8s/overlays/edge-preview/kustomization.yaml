apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ame-preview

resources:
  - namespace.yaml
  - ../../base

# Preview config: no AME_PRODUCTION, so auth cookies are not Secure-only and the
# preview works over plain HTTP. Do not point real users here.
configMapGenerator:
  - name: ame-config
    literals:
      - AME_PORT=8080
      - LOG_FORMAT=json
      - RUST_LOG=ame_api=info,tower_http=info,sqlx=warn
      - AME_CORS_ORIGINS=http://harus-pi.talpidae-beta.ts.net

secretGenerator:
  - name: ame-secrets
    envs:
      - secret.env

# Preview runs on the arm64 edge node (harus-pi). Images for this overlay must
# be built for linux/arm64 — see deploy/k8s/README.md (NOT built this round).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: arm64
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: arm64
  - target:
      kind: Ingress
      name: ame
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: harus-pi.talpidae-beta.ts.net
