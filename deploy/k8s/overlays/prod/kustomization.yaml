apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ame

resources:
  - namespace.yaml
  - ../../base

# Non-secret runtime config for the API (envFrom: ame-config).
configMapGenerator:
  - name: ame-config
    literals:
      - AME_PORT=8080
      - AME_PRODUCTION=1
      - LOG_FORMAT=json
      - RUST_LOG=ame_api=info,tower_http=info,sqlx=warn
      # Same-origin in practice, but set explicitly for credentialed requests.
      - AME_CORS_ORIGINS=https://harus-mini.talpidae-beta.ts.net

# Secrets read from a gitignored secret.env (see secret.env.example).
secretGenerator:
  - name: ame-secrets
    envs:
      - secret.env

# Prod runs on the amd64 control-plane node (harus-mini).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: amd64
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: amd64
  - target:
      kind: Ingress
      name: ame
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: harus-mini.talpidae-beta.ts.net
