apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ame-backup
  labels:
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ame-backup
  labels:
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *" # Daily at 2:00 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:18-alpine
              env:
                - name: PGHOST
                  value: ame-postgres
                - name: PGUSER
                  value: postgres
                - name: PGDATABASE
                  value: ame
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ame-secrets
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  BACKUP_DIR="/backups"
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  FILENAME="ame-db-${TIMESTAMP}.dump"
                  TEMP_FILENAME="${FILENAME}.tmp"
                  
                  echo "Starting database backup to ${BACKUP_DIR}/${FILENAME}..."
                  pg_dump -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -Fc -f "${BACKUP_DIR}/${TEMP_FILENAME}"
                  mv "${BACKUP_DIR}/${TEMP_FILENAME}" "${BACKUP_DIR}/${FILENAME}"
                  echo "Backup complete: ${FILENAME}"
                  
                  # Retention: keep only last 7 backups
                  echo "Cleaning up backups older than 7 days..."
                  find "${BACKUP_DIR}" -name "ame-db-*.dump" -mtime +7 -delete
                  echo "Cleanup complete."
              volumeMounts:
                - name: backup-volume
                  mountPath: /backups
          volumes:
            - name: backup-volume
              persistentVolumeClaim:
                claimName: ame-backup
