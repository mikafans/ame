# Single-host routing via Traefik (k3s default ingress controller).
# The API and web share one origin so the browser bundle's NEXT_PUBLIC_API_URL
# can point at the same host — no CORS. API path prefixes are more specific than
# "/", so Traefik routes them to the API; everything else falls through to web.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ame
  labels:
    app.kubernetes.io/component: ingress
spec:
  rules:
    - host: ame.example # overridden per overlay
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ame-api
                port:
                  number: 8080
          - path: /public/v1
            pathType: Prefix
            backend:
              service:
                name: ame-api
                port:
                  number: 8080
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: ame-api
                port:
                  number: 8080
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: ame-web
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ame-web
                port:
                  number: 3000
