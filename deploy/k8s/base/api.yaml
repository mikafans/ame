apiVersion: v1
kind: Service
metadata:
  name: ame-api
  labels:
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ame-api
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ame-api:latest
          # Images are side-loaded via `k3s ctr images import`, never pulled.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Assembled from the secret; $(VAR) expands an earlier env entry.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ame-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://postgres:$(POSTGRES_PASSWORD)@ame-postgres:5432/ame
            - name: AME_AGENT_ACCESS_CODE
              valueFrom:
                secretKeyRef:
                  name: ame-secrets
                  key: AME_AGENT_ACCESS_CODE
            - name: AME_VALKEY_URL
              value: redis://ame-valkey:6379
            - name: AME_TRUSTED_PROXIES
              value: "1"
          envFrom:
            - configMapRef:
                name: ame-config
          # /readyz pings Postgres/Valkey, while /healthz serves as a dumb liveness check.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
