apiVersion: v1
kind: ConfigMap
metadata:
  name: ame-public-docs-caddy
  labels:
    app.kubernetes.io/component: public-docs
data:
  Caddyfile: |
    :8081 {
        handle_path /public/* {
            root * /srv/docs
            file_server
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ame-web
  labels:
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ame-public-docs
  labels:
    app.kubernetes.io/component: public-docs
spec:
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ame-web
  labels:
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: public-docs-source
          image: ame-web:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /app/docs/public/. /srv/docs/"]
          volumeMounts:
            - name: public-docs
              mountPath: /srv/docs
      containers:
        - name: web
          image: ame-web:latest
          # NEXT_PUBLIC_API_URL is baked at build time (see deploy/k8s/README.md),
          # so the runtime image carries no API config — only the port.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
        - name: public-docs
          image: caddy:2.10-alpine
          ports:
            - name: public-docs
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /public/llms.txt
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          volumeMounts:
            - name: public-docs
              mountPath: /srv/docs
              readOnly: true
            - name: public-docs-caddy
              mountPath: /etc/caddy
              readOnly: true
      volumes:
        - name: public-docs
          emptyDir: {}
        - name: public-docs-caddy
          configMap:
            name: ame-public-docs-caddy
