# Production-shaped compose stack. Not a substitute for k8s; intended for
# smoke deploys, demos, and CI integration testing.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Override secrets via a sibling .env file (POSTGRES_PASSWORD, NEXT_PUBLIC_API_URL, ...).

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ame}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ame}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ghcr.io/launchbadge/sqlx-cli:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ame}
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["sqlx", "migrate", "run", "--source", "/migrations"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ame-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ame}
      RUST_LOG: ${RUST_LOG:-ame_api=info,tower_http=info,sqlx=warn}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the client bundle at build time — point at the public
        # API URL, not the in-cluster hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: ame-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
