[package]
name = "ame-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ame-api"
path = "src/main.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"

[dependencies]
anyhow = "1"
axum = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.43", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "uuid", "time", "json"] }
uuid = { version = "1", features = ["v7", "v4", "serde", "js"] }
rand = "0.8"
rand_core = "0.6"
time = { version = "0.3", features = ["serde"] }
argon2 = "0.5"
async-trait = "0.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
utoipa = { version = "5", features = ["uuid", "time"] }
serde_yaml = "0.9"

[dev-dependencies]
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.43", features = ["full", "test-util"] }
