[package]
name = "ame-api"
version = "0.2.1"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ame-api"
path = "src/main.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"

[dependencies]
anyhow = "1"
axum = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.43", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate"] }
uuid = { version = "1", features = ["v7", "v4", "serde", "js"] }
rand = "0.8"
time = { version = "0.3", features = ["serde"] }
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"
unicode-normalization = "0.1.24"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
utoipa = { version = "5", features = ["uuid", "time", "yaml"] }
serde_yaml = "0.9"
axum-prometheus = "0.10.0"
metrics = "0.24"
base64 = "0.22.1"
toml = "0.8"
deadpool-redis = "0.18"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.43", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hot_paths"
harness = false
