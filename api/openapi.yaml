openapi: 3.1.0
info:
  title: ame API
  description: Adaptive Mastery Engine — assessment platform with agent identity.
  license:
    name: ''
  version: 0.2.0
paths:
  /v1/admin/assessments:
    get:
      tags:
      - admin
      summary: GET /v1/admin/assessments — list all assessments on the platform
      operationId: list_assessments_admin
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: mode
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Assessments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListAssessmentsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /v1/admin/assessments/{id}:
    get:
      tags:
      - admin
      summary: GET /v1/admin/assessments/{id} — retrieve a single assessment with all questions for admin preview
      operationId: get_assessment_admin
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Assessment retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAssessmentDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
        '404':
          description: Assessment not found
      security:
      - bearer: []
    delete:
      tags:
      - admin
      summary: DELETE /v1/admin/assessments/{id} — soft-delete any assessment (moderation)
      operationId: delete_assessment_admin
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Assessment deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
        '404':
          description: Assessment not found
      security:
      - bearer: []
  /v1/admin/assessments/{id}/restore:
    post:
      tags:
      - admin
      summary: POST /v1/admin/assessments/{id}/restore — restore a soft-deleted assessment
      operationId: restore_assessment_admin
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Assessment restored successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
        '404':
          description: Assessment not found or not deleted
      security:
      - bearer: []
  /v1/admin/audit:
    get:
      tags:
      - admin
      summary: GET /v1/admin/audit — retrieve append-only audit trail logs
      operationId: list_audit_logs
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: actorId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: targetId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Audit trail successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditLogsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /v1/admin/health:
    get:
      tags:
      - admin
      summary: GET /v1/admin/health — retrieve cluster system & health metrics
      operationId: get_admin_health
      responses:
        '200':
          description: Admin health metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealthResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /v1/admin/settings:
    get:
      tags:
      - admin
      summary: |-
        GET /v1/admin/settings — current effective platform settings (config
        defaults overlaid with any tb_settings overrides).
      operationId: get_settings
      responses:
        '200':
          description: Effective platform settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveSettings'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
    put:
      tags:
      - admin
      summary: |-
        PUT /v1/admin/settings — upsert one or more setting overrides. Each changed
        key is written to tb_settings, the settings cache is busted, and one audit
        row is emitted. Returns the new effective settings.
      operationId: put_settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsBody'
        required: true
      responses:
        '200':
          description: Updated effective platform settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveSettings'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /v1/admin/tokens:
    get:
      tags:
      - admin
      summary: GET /v1/admin/tokens — list all API tokens with filtering
      operationId: list_tokens
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: role
        in: query
        required: false
        schema:
          type: string
      - name: ownerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Token list successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTokensResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /v1/admin/tokens/{id}:
    delete:
      tags:
      - admin
      summary: DELETE /v1/admin/tokens/{id} — revoke an API token (idempotent)
      operationId: delete_token_admin
      parameters:
      - name: id
        in: path
        description: Token ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Token revoked successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
        '404':
          description: Token not found
      security:
      - bearer: []
  /v1/admin/users:
    get:
      tags:
      - admin
      summary: GET /v1/admin/users — list all users
      operationId: list_users
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: User list successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /v1/admin/users/{id}:
    patch:
      tags:
      - admin
      summary: PATCH /v1/admin/users/{id} — toggle user plan or disable/deactivate user
      operationId: patch_user_admin
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserAdminBody'
        required: true
      responses:
        '204':
          description: User successfully updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
        '404':
          description: User not found
      security:
      - bearer: []
  /v1/assessments:
    get:
      tags:
      - assessments
      operationId: list_assessments
      parameters:
      - name: mode
        in: query
        description: Filter by mode (practice or graded)
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by status (draft, active, archived). When absent, returns public-active + caller's own.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'Page size (default: 50)'
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: List of assessments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssessmentsResponse'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
    post:
      tags:
      - assessments
      operationId: create_assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
        required: true
      responses:
        '201':
          description: Assessment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSummary'
        '401':
          description: Missing or invalid token
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/assessments/count:
    get:
      tags:
      - assessments
      operationId: count_assessments
      parameters:
      - name: mode
        in: query
        description: Filter by mode
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Assessment count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountAssessmentsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer_auth: []
  /v1/assessments/generate:
    post:
      tags:
      - assessments
      operationId: generate_assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAssessmentBody'
        required: true
      responses:
        '200':
          description: Generated assessment candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateAssessmentResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearer_auth: []
  /v1/assessments/{id}:
    get:
      tags:
      - assessments
      operationId: get_assessment
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Assessment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentDetail'
        '401':
          description: Missing or invalid token
        '404':
          description: Assessment not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - assessments
      operationId: delete_assessment
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Assessment deleted successfully
        '401':
          description: Missing or invalid token
        '404':
          description: Assessment not found
      security:
      - bearer_auth: []
    patch:
      tags:
      - assessments
      operationId: patch_assessment
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssessmentRequest'
        required: true
      responses:
        '200':
          description: Assessment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '401':
          description: Missing or invalid token
        '403':
          description: Not the owner
        '404':
          description: Assessment not found
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/assessments/{id}/questions:
    post:
      tags:
      - assessments
      operationId: add_assessment_question
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssessmentQuestionBody'
        required: true
      responses:
        '201':
          description: Question linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAssessmentQuestionResponse'
        '401':
          description: Unauthorized
        '404':
          description: No such assessment or question
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/assessments/{id}/questions/{question_id}:
    delete:
      tags:
      - assessments
      operationId: remove_assessment_question
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      - name: question_id
        in: path
        description: Question ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Question removed from assessment
        '401':
          description: Unauthorized
        '404':
          description: No such assessment or question
      security:
      - bearer_auth: []
  /v1/assessments/{id}/sections:
    post:
      tags:
      - assessments
      operationId: create_assessment_section
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSectionBody'
        required: true
      responses:
        '201':
          description: Section created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSectionDetail'
        '401':
          description: Unauthorized
        '404':
          description: Assessment not found
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/assessments/{id}/sections/{section_id}:
    delete:
      tags:
      - assessments
      operationId: delete_assessment_section
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      - name: section_id
        in: path
        description: Section ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Section deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: No such assessment or section
      security:
      - bearer_auth: []
    patch:
      tags:
      - assessments
      operationId: patch_assessment_section
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      - name: section_id
        in: path
        description: Section ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSectionBody'
        required: true
      responses:
        '200':
          description: Section updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSectionDetail'
        '401':
          description: Unauthorized
        '404':
          description: No such assessment or section
      security:
      - bearer_auth: []
  /v1/attempts/pending:
    get:
      tags:
      - crate::http::sessions
      operationId: list_pending_attempts
      responses:
        '200':
          description: Pending manual attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingAttemptRow'
        '401':
          description: Agent role not allowed
      security:
      - bearer_auth: []
  /v1/attempts/{id}/grade:
    patch:
      tags:
      - crate::http::sessions
      operationId: grade_attempt
      parameters:
      - name: id
        in: path
        description: Attempt id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeAttemptBody'
        required: true
      responses:
        '200':
          description: Graded attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          description: Agent role not allowed
        '404':
          description: No such attempt
        '409':
          description: Attempt is not pending manual grading
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: POST /v1/auth/login — authenticate with email and password.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
        required: true
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: POST /v1/auth/logout — clear the HttpOnly token cookie.
      operationId: logout
      responses:
        '200':
          description: Logged out
  /v1/auth/register:
    post:
      tags:
      - auth
      summary: POST /v1/auth/register — register a new user with email and password.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
        required: true
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation failed
  /v1/deep-dives:
    get:
      tags:
      - deep-dives
      operationId: list_deep_dives
      parameters:
      - name: status
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: category
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: search
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: List of deep dives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeepDivesResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
    post:
      tags:
      - deep-dives
      operationId: create_deep_dive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeepDiveBody'
        required: true
      responses:
        '201':
          description: Deep dive created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDive'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Question, session, or attempt not found
      security:
      - bearer: []
  /v1/deep-dives/export:
    get:
      tags:
      - deep-dives
      operationId: export_deep_dives
      responses:
        '200':
          description: ZIP archive of deep dives
          content:
            application/octet-stream:
              schema:
                type: array
                items:
                  type: integer
                  format: int32
                  minimum: 0
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/deep-dives/{id}:
    get:
      tags:
      - deep-dives
      operationId: get_deep_dive
      parameters:
      - name: id
        in: path
        description: Deep dive ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Deep dive details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDive'
        '401':
          description: Unauthorized
        '404':
          description: Deep dive not found
      security:
      - bearer: []
    patch:
      tags:
      - deep-dives
      operationId: patch_deep_dive
      parameters:
      - name: id
        in: path
        description: Deep dive ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDeepDiveBody'
        required: true
      responses:
        '200':
          description: Deep dive updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDive'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Deep dive not found
      security:
      - bearer: []
  /v1/deep-dives/{id}/publish:
    patch:
      tags:
      - deep-dives
      operationId: publish_deep_dive
      parameters:
      - name: id
        in: path
        description: Deep dive ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishDeepDiveBody'
        required: true
      responses:
        '200':
          description: Deep dive published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDive'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Deep dive not found
      security:
      - bearer: []
  /v1/deep-dives/{id}/revisions:
    get:
      tags:
      - deep-dives
      operationId: get_deep_dive_revisions
      parameters:
      - name: id
        in: path
        description: Deep dive ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of revisions for the deep dive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDiveRevisionsResponse'
        '401':
          description: Unauthorized
        '404':
          description: Deep dive not found
      security:
      - bearer: []
  /v1/explore:
    get:
      tags:
      - assessments
      summary: GET /v1/explore — searchable, paginated assessment exploration.
      operationId: explore
      parameters:
      - name: tags
        in: query
        required: false
        schema:
          type: string
      - name: kind
        in: query
        required: false
        schema:
          type: string
      - name: mode
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: after
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Assessment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploreResponse'
        '401':
          description: Unauthorized
      security:
      - bearer_auth: []
  /v1/explore/facets:
    get:
      tags:
      - assessments
      summary: GET /v1/explore/facets — facets for filtering.
      operationId: explore_facets
