openapi: 3.1.0
info:
  title: ame API
  description: Adaptive Mastery Engine — quiz & exam platform with agent identity.
  license:
    name: ''
  version: 0.1.0
paths:
  /v1/admin/audit:
    get:
      tags:
      - admin
      summary: GET /v1/admin/audit — retrieve append-only audit trail logs
      operationId: list_audit_logs
      responses:
        '200':
          description: Audit trail successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditLogsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /v1/admin/moderate:
    post:
      tags:
      - admin
      summary: POST /v1/admin/moderate — moderate public content by unpublishing it (setting visibility private)
      operationId: moderate_quiz
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateBody'
        required: true
      responses:
        '204':
          description: Public content moderated and unpublished successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
        '404':
          description: Content not found
      security:
      - bearer: []
  /v1/admin/users:
    get:
      tags:
      - admin
      summary: GET /v1/admin/users — list all users
      operationId: list_users
      responses:
        '200':
          description: User list successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /v1/admin/users/{id}:
    patch:
      tags:
      - admin
      summary: PATCH /v1/admin/users/{id} — toggle user plan or disable/deactivate user
      operationId: patch_user_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserAdminBody'
        required: true
      responses:
        '204':
          description: User successfully updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
        '404':
          description: User not found
      security:
      - bearer: []
  /v1/assessments:
    get:
      tags:
      - assessments
      operationId: list_assessments
      parameters:
      - name: mode
        in: query
        description: Filter by mode (practice or graded)
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by status (draft, active, archived). When absent, returns public-active + caller's own.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'Page size (default: 50)'
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: List of assessments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssessmentsResponse'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
    post:
      tags:
      - assessments
      operationId: create_assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
        required: true
      responses:
        '201':
          description: Assessment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSummary'
        '401':
          description: Missing or invalid token
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/assessments/count:
    get:
      tags:
      - assessments
      operationId: count_assessments
      parameters:
      - name: mode
        in: query
        description: Filter by mode
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Assessment count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountAssessmentsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer_auth: []
  /v1/assessments/explore:
    get:
      tags:
      - assessments
      operationId: explore
      parameters:
      - name: limit
        in: query
        description: 'Page size (default: 50)'
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Public assessment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssessmentsResponse'
      security:
      - bearer_auth: []
  /v1/assessments/generate:
    post:
      tags:
      - assessments
      operationId: generate_assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAssessmentBody'
        required: true
      responses:
        '200':
          description: Generated assessment candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateAssessmentResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearer_auth: []
  /v1/assessments/{id}:
    get:
      tags:
      - assessments
      operationId: get_assessment
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Assessment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentDetail'
        '401':
          description: Missing or invalid token
        '404':
          description: Assessment not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - assessments
      operationId: delete_assessment
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Assessment deleted successfully
        '401':
          description: Missing or invalid token
        '404':
          description: Assessment not found
      security:
      - bearer_auth: []
    patch:
      tags:
      - assessments
      operationId: patch_assessment
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssessmentRequest'
        required: true
      responses:
        '200':
          description: Assessment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '401':
          description: Missing or invalid token
        '403':
          description: Not the owner
        '404':
          description: Assessment not found
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/assessments/{id}/questions:
    post:
      tags:
      - assessments
      operationId: add_assessment_question
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssessmentQuestionBody'
        required: true
      responses:
        '201':
          description: Question linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAssessmentQuestionResponse'
        '401':
          description: Unauthorized
        '404':
          description: No such assessment or question
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/assessments/{id}/questions/{question_id}:
    delete:
      tags:
      - assessments
      operationId: remove_assessment_question
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      - name: question_id
        in: path
        description: Question ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Question removed from assessment
        '401':
          description: Unauthorized
        '404':
          description: No such assessment or question
      security:
      - bearer_auth: []
  /v1/assessments/{id}/sections:
    post:
      tags:
      - assessments
      operationId: create_assessment_section
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSectionBody'
        required: true
      responses:
        '201':
          description: Section created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSectionDetail'
        '401':
          description: Unauthorized
        '404':
          description: Assessment not found
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/assessments/{id}/sections/{section_id}:
    delete:
      tags:
      - assessments
      operationId: delete_assessment_section
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      - name: section_id
        in: path
        description: Section ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Section deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: No such assessment or section
      security:
      - bearer_auth: []
    patch:
      tags:
      - assessments
      operationId: patch_assessment_section
      parameters:
      - name: id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      - name: section_id
        in: path
        description: Section ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSectionBody'
        required: true
      responses:
        '200':
          description: Section updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSectionDetail'
        '401':
          description: Unauthorized
        '404':
          description: No such assessment or section
      security:
      - bearer_auth: []
  /v1/attempts/pending:
    get:
      tags:
      - crate::http::sessions
      operationId: list_pending_attempts
      responses:
        '200':
          description: Pending manual attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingAttemptRow'
        '401':
          description: Agent role not allowed
      security:
      - bearer_auth: []
  /v1/attempts/{id}/grade:
    patch:
      tags:
      - crate::http::sessions
      operationId: grade_attempt
      parameters:
      - name: id
        in: path
        description: Attempt id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeAttemptBody'
        required: true
      responses:
        '200':
          description: Graded attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          description: Agent role not allowed
        '404':
          description: No such attempt
        '409':
          description: Attempt is not pending manual grading
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: POST /v1/auth/login — authenticate with email and password.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
        required: true
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: POST /v1/auth/logout — clear the HttpOnly token cookie.
      operationId: logout
      responses:
        '200':
          description: Logged out
  /v1/auth/register:
    post:
      tags:
      - auth
      summary: POST /v1/auth/register — register a new user with email and password.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
        required: true
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation failed
  /v1/me:
    get:
      tags:
      - me
      summary: Get the authenticated user's profile.
      operationId: get_me
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/me/agents:
    get:
      tags:
      - me
      operationId: list_agents
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
    post:
      tags:
      - me
      operationId: create_agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentBody'
        required: true
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation failed
      security:
      - bearer: []
  /v1/me/agents/{id}:
    delete:
      tags:
      - me
      operationId: delete_agent
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Agent deleted
        '401':
          description: Unauthorized
        '404':
          description: No such agent
      security:
      - bearer: []
    patch:
      tags:
      - me
      operationId: update_agent
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentBody'
        required: true
      responses:
        '204':
          description: Agent updated
        '401':
          description: Unauthorized
        '404':
          description: No such agent
      security:
      - bearer: []
  /v1/me/attempts:
    get:
      tags:
      - me
      summary: List the current user's attempts.
      operationId: list_attempts
      parameters:
      - name: limit
        in: query
        description: 'Page size (default: 50)'
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset
        required: false
        schema:
          type: integer
          format: int64
      - name: session_id
        in: query
        description: Filter by session
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Attempt list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAttemptsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/me/cohort-stats:
    get:
      tags:
      - me
      operationId: get_cohort_stats
      parameters:
      - name: assessmentId
        in: query
        description: Assessment to compare against
        required: false
        schema:
          type: string
          format: uuid
      - name: quizId
        in: query
        description: Quiz (legacy) to compare against
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cohort stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortStatsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/plans:
    post:
      tags:
      - crate::http::plans
      operationId: create_plan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanBody'
        required: true
      responses:
        '201':
          description: Study plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/plans/{id}:
    get:
      tags:
      - crate::http::plans
      operationId: get_plan
      parameters:
      - name: id
        in: path
        description: Plan id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Study plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '404':
          description: Not found
      security:
      - bearer_auth: []
  /v1/questions:
    get:
      tags:
      - questions
      operationId: list_questions
      parameters:
      - name: tag
        in: query
        description: Filter by tag name
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by status (draft, live, archived)
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: Partial match on prompt
        required: false
        schema:
          type: string
      - name: kind
        in: query
        description: Filter by question kind
        required: false
        schema:
          type: string
      - name: after
        in: query
        description: Pagination cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Question list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListQuestionsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
    post:
      tags:
      - questions
      operationId: create_questions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionsBody'
        required: true
      responses:
        '201':
          description: Questions created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateQuestionsResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation failed
      security:
      - bearer: []
  /v1/questions/{id}:
    get:
      tags:
      - questions
      operationId: get_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: Question not found
      security:
      - bearer: []
    patch:
      tags:
      - questions
      operationId: update_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionPatch'
        required: true
      responses:
        '200':
          description: Question updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: Question not found
        '422':
          description: Validation failed
      security:
      - bearer: []
  /v1/questions/{id}/archive:
    post:
      tags:
      - questions
      operationId: archive_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: Question not found
      security:
      - bearer: []
  /v1/questions/{id}/promote:
    post:
      tags:
      - questions
      operationId: promote_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question promoted to live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: Question not found
      security:
      - bearer: []
  /v1/questions/{id}/versions:
    get:
      tags:
      - questions
      operationId: list_versions
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuestionVersion'
        '404':
          description: Question not found
      security:
      - bearer: []
  /v1/sessions:
    get:
      tags:
      - crate::http::sessions
      operationId: list_my_sessions
      parameters:
      - name: assessmentId
        in: query
        description: Filter by assessment
        required: false
        schema:
          type: string
          format: uuid
      - name: quizId
        in: query
        description: Filter by quiz (legacy)
        required: false
        schema:
          type: string
          format: uuid
      - name: examId
        in: query
        description: Filter by exam (legacy)
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Attempt history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMySessionsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer_auth: []
    post:
      tags:
      - crate::http::sessions
      operationId: create_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionBody'
        required: true
      responses:
        '201':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/sessions/{id}:
    get:
      tags:
      - crate::http::sessions
      operationId: get_session
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Session resume state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSessionResponse'
        '404':
          description: No such session
      security:
      - bearer_auth: []
    patch:
      tags:
      - crate::http::sessions
      operationId: patch_session
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSessionBody'
        required: true
      responses:
        '200':
          description: Session updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: No such session
      security:
      - bearer_auth: []
  /v1/sessions/{id}/answer:
    post:
      tags:
      - crate::http::sessions
      operationId: answer
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSessionBody'
        required: true
      responses:
        '200':
          description: Stored answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSessionResponse'
        '410':
          description: Session expired
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/sessions/{id}/finish:
    post:
      tags:
      - crate::http::sessions
      operationId: finish
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Finished session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishSessionResponse'
        '404':
          description: No such session
      security:
      - bearer_auth: []
  /v1/tags:
    get:
      tags:
      - crate::http::tags
      operationId: list_tags
      responses:
        '200':
          description: All tags, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
