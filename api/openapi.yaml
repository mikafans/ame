openapi: 3.1.0
info:
  title: ame API
  description: Question collector + exam platform.
  license:
    name: ''
  version: 0.1.0
paths:
  /v1/exams/{id}/stats:
    get:
      tags:
      - crate::http::stats
      operationId: exam_stats
      parameters:
      - name: id
        in: path
        description: Exam id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Exam stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamStatsResponse'
        '403':
          description: Requires stats.read scope
        '404':
          description: Exam not found
      security:
      - bearer_auth: []
  /v1/me:
    get:
      tags:
      - me
      summary: Get the authenticated user's profile.
      operationId: get_me
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/me/attempts:
    get:
      tags:
      - me
      summary: List the current user's attempts.
      operationId: list_attempts
      parameters:
      - name: limit
        in: query
        description: 'Page size (default: 50)'
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset
        required: false
        schema:
          type: integer
          format: int64
      - name: session_id
        in: query
        description: Filter by session
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Attempt list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAttemptsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/messages:
    post:
      tags:
      - crate::http::messages
      operationId: send_message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageBody'
        required: true
      responses:
        '201':
          description: Message queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Requires feedback.write scope
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/plans:
    post:
      tags:
      - crate::http::plans
      operationId: create_plan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanBody'
        required: true
      responses:
        '201':
          description: Study plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/plans/{id}:
    get:
      tags:
      - crate::http::plans
      operationId: get_plan
      parameters:
      - name: id
        in: path
        description: Plan id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Study plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '404':
          description: Not found
      security:
      - bearer_auth: []
  /v1/questions:
    get:
      tags:
      - crate::http::questions
      operationId: list_questions
      parameters:
      - name: tag
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: path
        required: true
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuestionStatus'
      - name: min_rating
        in: path
        required: true
        schema:
          type:
          - number
          - 'null'
          format: double
      - name: max_rating
        in: path
        required: true
        schema:
          type:
          - number
          - 'null'
          format: double
      - name: limit
        in: path
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: offset
        in: path
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Filtered list of questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionListResponse'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
    post:
      tags:
      - crate::http::questions
      operationId: create_questions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionsBody'
        required: true
      responses:
        '201':
          description: Batch of created questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateQuestionsResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '409':
          description: Idempotency key conflict
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/questions/{id}:
    get:
      tags:
      - crate::http::questions
      operationId: get_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: No such question
      security:
      - bearer_auth: []
    patch:
      tags:
      - crate::http::questions
      operationId: update_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionPatch'
        required: true
      responses:
        '200':
          description: Updated question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '404':
          description: No such question
        '422':
          description: Cannot edit archived question
      security:
      - bearer_auth: []
  /v1/questions/{id}/archive:
    post:
      tags:
      - crate::http::questions
      operationId: archive_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: No such question
      security:
      - bearer_auth: []
  /v1/questions/{id}/promote:
    post:
      tags:
      - crate::http::questions
      operationId: promote_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question promoted to live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: No such question
      security:
      - bearer_auth: []
  /v1/questions/{id}/versions:
    get:
      tags:
      - crate::http::questions
      operationId: list_versions
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Historical versions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionVersionsResponse'
        '404':
          description: No such question
      security:
      - bearer_auth: []
  /v1/quizzes:
    get:
      tags:
      - quizzes
      summary: List quizzes.
      operationId: list_quizzes
      parameters:
      - name: status
        in: query
        description: 'Filter by status (default: active)'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'Page size (default: 50)'
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Quiz list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListQuizzesResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/quizzes/{id}/stats:
    get:
      tags:
      - crate::http::stats
      operationId: quiz_stats
      parameters:
      - name: id
        in: path
        description: Quiz id
        required: true
        schema:
          type: string
          format: uuid
      - name: cohortId
        in: query
        description: Filter by cohort (future)
        required: false
        schema:
          type: string
          format: uuid
      - name: window
        in: query
        description: '''last30d'' | ''all'''
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Quiz stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizStatsResponse'
        '403':
          description: Requires stats.read scope
        '404':
          description: Quiz not found
      security:
      - bearer_auth: []
  /v1/sessions:
    post:
      tags:
      - crate::http::sessions
      operationId: create_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionBody'
        required: true
      responses:
        '201':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/sessions/{id}:
    get:
      tags:
      - crate::http::sessions
      operationId: get_session
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Session resume state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSessionResponse'
        '404':
          description: No such session
      security:
      - bearer_auth: []
  /v1/sessions/{id}/answer:
    post:
      tags:
      - crate::http::sessions
      operationId: answer
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSessionBody'
        required: true
      responses:
        '200':
          description: Stored answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSessionResponse'
        '410':
          description: Session expired
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/sessions/{id}/finish:
    post:
      tags:
      - crate::http::sessions
      operationId: finish
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Finished session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishSessionResponse'
        '404':
          description: No such session
      security:
      - bearer_auth: []
  /v1/tags:
    get:
      tags:
      - crate::http::tags
      operationId: list_tags
      responses:
        '200':
          description: All tags, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
    post:
      tags:
      - crate::http::tags
      operationId: create_tag
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagBody'
        required: true
      responses:
        '201':
          description: Tag created (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
      security:
      - bearer_auth: []
components:
  schemas:
    AnswerSessionBody:
      type: object
      required:
      - questionId
      - response
      properties:
        questionId:
          type: string
          format: uuid
        response:
          $ref: '#/components/schemas/AttemptResponse'
        timeToAnswerMs:
          type:
          - integer
          - 'null'
          format: int32
    AnswerSessionResponse:
      type: object
      required:
      - attempt
      - grade
      - replayed
      properties:
        attempt:
          $ref: '#/components/schemas/Attempt'
        grade:
          $ref: '#/components/schemas/GradeOutcome'
        replayed:
          type: boolean
    Attempt:
      type: object
      required:
      - id
      - user_id
      - question_id
      - question_version
      - response
      - presentation
      - is_correct
      - score
      - grade_status
      - rating_before_user_avg
      - rating_before_question
      - user_tag_deltas
      - question_delta
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        grade_status:
          type: string
        grader_notes:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        is_correct:
          type: boolean
        presentation:
          $ref: '#/components/schemas/AttemptPresentation'
        question_delta:
          type: number
          format: double
        question_id:
          type: string
          format: uuid
        question_version:
          type: integer
          format: int32
        rating_before_question:
          type: number
          format: double
        rating_before_user_avg:
          type: number
          format: double
        response:
          $ref: '#/components/schemas/AttemptResponse'
        score:
          type: number
          format: double
        session_id:
          type:
          - string
          - 'null'
          format: uuid
        time_to_answer_ms:
          type:
          - integer
          - 'null'
          format: int32
        user_id:
          type: string
          format: uuid
        user_tag_deltas:
          type: object
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
    AttemptPresentation:
      type: object
      properties:
        option_order:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
    AttemptResponse:
      oneOf:
      - type: object
        required:
        - selected_position
        properties:
          selected_position:
            type: integer
            minimum: 0
      - type: object
        required:
        - answer
        properties:
          answer:
            type: boolean
      - type: object
        required:
        - answer
        properties:
          answer:
            type: string
      - type: object
        required:
        - body
        - word_count
        properties:
          body:
            type: string
          word_count:
            type: integer
            format: int32
      - type: object
        required:
        - source
        - language
        properties:
          language:
            type: string
          source:
            type: string
    CodePayload:
      type: object
      required:
      - language
      - starter
      properties:
        exemplar:
          type:
          - string
          - 'null'
        language:
          type: string
        starter:
          type: string
        tests:
          type: array
          items:
            $ref: '#/components/schemas/CodeTest'
        time_limit_ms:
          type:
          - integer
          - 'null'
          format: int32
    CodeSnippet:
      type: object
      required:
      - language
      - body
      properties:
        body:
          type: string
        caption:
          type:
          - string
          - 'null'
        language:
          type: string
    CodeTest:
      type: object
      required:
      - name
      - body
      properties:
        body:
          type: string
        name:
          type: string
    CreateKeyBody:
      type: object
      required:
      - label
      - scopes
      properties:
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
    CreateKeyResponse:
      type: object
      required:
      - apiKey
      - prefix
      - id
      properties:
        apiKey:
          type: string
        id:
          type: string
          format: uuid
        prefix:
          type: string
    CreatePlanBody:
      type: object
      required:
      - goal
      properties:
        goal:
          type: string
        lookbackDays:
          type:
          - integer
          - 'null'
          format: int64
    CreateQuestionsBody:
      type: object
      required:
      - questions
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionInsert'
    CreateQuestionsResponse:
      type: object
      required:
      - questions
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    CreateSessionBody:
      type: object
      properties:
        cats:
          type: array
          items:
            type: string
        count:
          type:
          - integer
          - 'null'
          minimum: 0
        diff:
          type:
          - string
          - 'null'
        duration:
          type:
          - integer
          - 'null'
          format: int64
        examId:
          type:
          - string
          - 'null'
          format: uuid
        mode:
          type:
          - string
          - 'null'
        quizId:
          type:
          - string
          - 'null'
          format: uuid
        tags:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            $ref: '#/components/schemas/QuestionKind'
    CreateSessionResponse:
      type: object
      required:
      - sessionId
      - questions
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SessionQuestion'
        sessionId:
          type: string
          format: uuid
    CreateTagBody:
      type: object
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type: string
    CreateWebhookBody:
      type: object
      required:
      - url
      - events
      properties:
        events:
          type: array
          items:
            type: string
        url:
          type: string
    CreateWebhookResponse:
      type: object
      required:
      - id
      - secret
      properties:
        id:
          type: string
          format: uuid
        secret:
          type: string
    DistributionBucket:
      type: object
      required:
      - bucket
      - count
      properties:
        bucket:
          type: integer
          format: int32
        count:
          type: integer
          format: int64
    EssayPayload:
      type: object
      required:
      - judge
      properties:
        judge:
          $ref: '#/components/schemas/Judge'
        min_words:
          type:
          - integer
          - 'null'
          format: int32
        rubric:
          type:
          - string
          - 'null'
    ExamStatsResponse:
      type: object
      required:
      - passRate
      - sectionAvgs
      properties:
        passRate:
          type: number
          format: double
        sectionAvgs:
          type: array
          items:
            $ref: '#/components/schemas/SectionAvg'
        timeP50:
          type:
          - number
          - 'null'
          format: double
        timeP95:
          type:
          - number
          - 'null'
          format: double
    FinishSessionResponse:
      type: object
      required:
      - session
      - result
      properties:
        result:
          $ref: '#/components/schemas/SessionResult'
        session:
          $ref: '#/components/schemas/Session'
    GenerateBody:
      type: object
      required:
      - source
      properties:
        objectives:
          type:
          - array
          - 'null'
          items:
            type: string
        questionCount:
          type: integer
          format: int32
          minimum: 0
        source:
          type: string
        types:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QuestionKind'
    GenerateResponse:
      type: object
      required:
      - candidates
      - objectives
      - warnings
      properties:
        candidates:
          type: array
          items: {}
        objectives:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    GetQuizResponse:
      type: object
      required:
      - id
      - title
      - status
      - objectives
      - createdBy
      - createdAt
      - updatedAt
      - questions
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        objectives:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
        status:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
    GetSessionQuestion:
      type: object
      required:
      - questionId
      - kind
      - prompt
      - points
      properties:
        codeSnippet: {}
        explanation:
          type:
          - string
          - 'null'
        kind:
          $ref: '#/components/schemas/QuestionKind'
        optionOrder:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
        options:
          type:
          - array
          - 'null'
          items: {}
        points:
          type: integer
          format: int32
        prompt:
          type: string
        questionId:
          type: string
          format: uuid
    GetSessionResponse:
      type: object
      required:
      - session
      - questions
      - attempts
      properties:
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/GetSessionQuestion'
        session:
          $ref: '#/components/schemas/Session'
    GradeOutcome:
      type: object
      required:
      - status
      - correct
      - points_awarded
      - max
      - correct_answer
      properties:
        correct:
          type: boolean
        correct_answer:
          type: object
        max:
          type: integer
          format: int32
        note:
          type:
          - string
          - 'null'
        points_awarded:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/GradeStatus'
    GradeStatus:
      type: string
      enum:
      - graded
      - pending_manual
    ItemStats:
      type: object
      required:
      - questionId
      - correctRate
      - avgTimeMs
      properties:
        avgTimeMs:
          type: number
          format: double
        correctRate:
          type: number
          format: double
        discriminationIdx:
          type:
          - number
          - 'null'
          format: double
        questionId:
          type: string
          format: uuid
    Judge:
      type: string
      description: |-
        Free-text judge. Only `exact` is supported in MVP; `llm` is reserved for
        the deferred LLM-as-judge feature.
      enum:
      - exact
      - manual
      - llm
    KeySummary:
      type: object
      required:
      - id
      - name
      - scopes
      - createdAt
      properties:
        createdAt:
          type: string
