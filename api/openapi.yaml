openapi: 3.1.0
info:
  title: ame API
  description: Question collector + exam platform.
  license:
    name: ''
  version: 0.1.0
paths:
  /v1/admin/audit:
    get:
      tags:
      - admin
      summary: GET /v1/admin/audit — retrieve append-only audit trail logs
      operationId: list_audit_logs
      responses:
        '200':
          description: Audit trail successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditLogsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /v1/admin/moderate:
    post:
      tags:
      - admin
      summary: POST /v1/admin/moderate — moderate public content by unpublishing it (setting visibility private)
      operationId: moderate_quiz
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateBody'
        required: true
      responses:
        '204':
          description: Public content moderated and unpublished successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
        '404':
          description: Content not found
      security:
      - bearer: []
  /v1/admin/users:
    get:
      tags:
      - admin
      summary: GET /v1/admin/users — list all users
      operationId: list_users
      responses:
        '200':
          description: User list successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /v1/admin/users/{id}:
    patch:
      tags:
      - admin
      summary: PATCH /v1/admin/users/{id} — toggle user plan or disable/deactivate user
      operationId: patch_user_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserAdminBody'
        required: true
      responses:
        '204':
          description: User successfully updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
        '404':
          description: User not found
      security:
      - bearer: []
  /v1/attempts/pending:
    get:
      tags:
      - crate::http::sessions
      operationId: list_pending_attempts
      responses:
        '200':
          description: Pending manual attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingAttemptRow'
        '401':
          description: Agent role not allowed
      security:
      - bearer_auth: []
  /v1/attempts/{id}/grade:
    patch:
      tags:
      - crate::http::sessions
      operationId: grade_attempt
      parameters:
      - name: id
        in: path
        description: Attempt id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeAttemptBody'
        required: true
      responses:
        '200':
          description: Graded attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          description: Agent role not allowed
        '404':
          description: No such attempt
        '409':
          description: Attempt is not pending manual grading
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/exams:
    get:
      tags:
      - crate::http::exams
      operationId: list_exams
      responses:
        '200':
          description: List of exams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListExamsResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - crate::http::exams
      operationId: compose_exam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeExamBody'
        required: true
      responses:
        '201':
          description: Exam composed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeExamResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '422':
          description: Validation failed or pool insufficient
      security:
      - bearer_auth: []
  /v1/exams/{id}:
    get:
      tags:
      - crate::http::exams
      operationId: get_exam
      parameters:
      - name: id
        in: path
        description: Exam id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Exam with sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExamResponse'
        '404':
          description: Not found
      security:
      - bearer_auth: []
    patch:
      tags:
      - crate::http::exams
      operationId: patch_exam_status
      parameters:
      - name: id
        in: path
        description: Exam id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchExamStatusBody'
        required: true
      responses:
        '200':
          description: Exam status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchExamStatusResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '404':
          description: Exam not found
        '422':
          description: Invalid status value
      security:
      - bearer_auth: []
  /v1/exams/{id}/stats:
    get:
      tags:
      - crate::http::stats
      operationId: exam_stats
      parameters:
      - name: id
        in: path
        description: Exam id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Exam stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamStatsResponse'
        '403':
          description: Requires stats.read scope
        '404':
          description: Exam not found
      security:
      - bearer_auth: []
  /v1/explore:
    get:
      tags:
      - quizzes
      operationId: explore
      parameters:
      - name: limit
        in: query
        description: 'Page size (default: 50)'
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Public quiz list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploreResponse'
      security:
      - bearer: []
  /v1/me:
    get:
      tags:
      - me
      summary: Get the authenticated user's profile.
      operationId: get_me
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/me/agents:
    get:
      tags:
      - me
      summary: List agents owned by the current user.
      operationId: list_agents
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
    post:
      tags:
      - me
      summary: Create a new agent sub-account.
      operationId: create_agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentBody'
        required: true
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation failed
      security:
      - bearer: []
  /v1/me/agents/{id}:
    delete:
      tags:
      - me
      summary: Delete an agent sub-account.
      operationId: delete_agent
      parameters:
      - name: id
        in: path
        description: Agent ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Agent deleted
        '401':
          description: Unauthorized
        '404':
          description: Agent not found
      security:
      - bearer: []
    patch:
      tags:
      - me
      summary: Update an agent's label.
      operationId: update_agent
      parameters:
      - name: id
        in: path
        description: Agent ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentBody'
        required: true
      responses:
        '204':
          description: Agent updated
        '401':
          description: Unauthorized
        '404':
          description: Agent not found
        '422':
          description: Validation failed
      security:
      - bearer: []
  /v1/me/attempts:
    get:
      tags:
      - me
      summary: List the current user's attempts.
      operationId: list_attempts
      parameters:
      - name: limit
        in: query
        description: 'Page size (default: 50)'
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset
        required: false
        schema:
          type: integer
          format: int64
      - name: session_id
        in: query
        description: Filter by session
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Attempt list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAttemptsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/me/cohort-stats:
    get:
      tags:
      - me
      operationId: get_cohort_stats
      parameters:
      - name: quizId
        in: query
        description: Quiz to compare against
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cohort stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortStatsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/me/export:
    get:
      tags:
      - export
      summary: GET /v1/me/export — export premium-only owner data bundle
      description: |-
        Returns quizzes, questions, sessions, attempts, and tag ratings owned by this user
        and any of their agents. Premium plan required, throttled via governor, audited.
      operationId: export_data
      responses:
        '200':
          description: Owner data successfully exported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Premium required)
        '429':
          description: Too Many Requests (Throttled)
      security:
      - bearer: []
  /v1/me/stats:
    get:
      tags:
      - crate::http::stats
      operationId: me_stats
      parameters:
      - name: window
        in: query
        description: One of `last30d` (≈4 weeks), `last90d` (≈12 weeks), or `all`.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: User stats summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeStatsResponse'
      security:
      - bearer_auth: []
  /v1/messages:
    post:
      tags:
      - crate::http::messages
      operationId: send_message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageBody'
        required: true
      responses:
        '201':
          description: Message queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Requires feedback.write scope
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/plans:
    post:
      tags:
      - crate::http::plans
      operationId: create_plan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanBody'
        required: true
      responses:
        '201':
          description: Study plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/plans/{id}:
    get:
      tags:
      - crate::http::plans
      operationId: get_plan
      parameters:
      - name: id
        in: path
        description: Plan id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Study plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '404':
          description: Not found
      security:
      - bearer_auth: []
  /v1/questions:
    get:
      tags:
      - crate::http::questions
      operationId: list_questions
      parameters:
      - name: tag
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: path
        required: true
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuestionStatus'
      - name: minRating
        in: path
        required: true
        schema:
          type:
          - number
          - 'null'
          format: double
      - name: maxRating
        in: path
        required: true
        schema:
          type:
          - number
          - 'null'
          format: double
      - name: limit
        in: path
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: offset
        in: path
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: search
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: kind
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: path
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: pageSize
        in: path
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: cursor
        in: path
        description: |-
          Keyset cursor from a prior response's `nextCursor`; when set, `page` is
          ignored and the next rows after the cursor are returned.
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Filtered list of questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionListResponse'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
    post:
      tags:
      - crate::http::questions
      operationId: create_questions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionsBody'
        required: true
      responses:
        '201':
          description: Batch of created questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateQuestionsResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '409':
          description: Idempotency key conflict
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/questions/{id}:
    get:
      tags:
      - crate::http::questions
      operationId: get_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: No such question
      security:
      - bearer_auth: []
    patch:
      tags:
      - crate::http::questions
      operationId: update_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionPatch'
        required: true
      responses:
        '200':
          description: Updated question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '404':
          description: No such question
        '422':
          description: Cannot edit archived question
      security:
      - bearer_auth: []
  /v1/questions/{id}/archive:
    post:
      tags:
      - crate::http::questions
      operationId: archive_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: No such question
      security:
      - bearer_auth: []
  /v1/questions/{id}/promote:
    post:
      tags:
      - crate::http::questions
      operationId: promote_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question promoted to live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: No such question
      security:
      - bearer_auth: []
  /v1/questions/{id}/versions:
    get:
      tags:
      - crate::http::questions
      operationId: list_versions
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Historical versions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionVersionsResponse'
        '404':
          description: No such question
      security:
      - bearer_auth: []
  /v1/quizzes:
    get:
      tags:
      - quizzes
      summary: List quizzes.
      operationId: list_quizzes
      parameters:
      - name: status
        in: query
        description: 'Filter by status (default: active)'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'Page size (default: 50)'
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Page offset
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Quiz list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListQuizzesResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
    post:
      tags:
      - quizzes
      summary: Create a new quiz.
      description: Only instructors and admins may create quizzes. Learners receive 403.
      operationId: create_quiz
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizBody'
        required: true
      responses:
        '201':
          description: Quiz created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateQuizResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (learner cannot create)
      security:
      - bearer: []
  /v1/quizzes/count:
    get:
      tags:
      - quizzes
      summary: Get quiz count with optional filters.
      operationId: count_quizzes
      parameters:
      - name: cats
        in: query
        description: Comma-separated categories
        required: false
        schema:
          type: string
      - name: tags
        in: query
        description: Comma-separated tags
        required: false
        schema:
          type: string
      - name: diff
        in: query
        description: Difficulty filter
        required: false
        schema:
          type: string
      - name: types
        in: query
        description: Comma-separated types
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Quiz count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountQuizzesResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /v1/quizzes/generate:
    post:
      tags:
      - quizzes
      operationId: generate_quiz
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateBody'
        required: true
      responses:
        '200':
          description: Generated quiz candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearer: []
  /v1/quizzes/{id}:
    get:
      tags:
      - quizzes
      operationId: get_quiz
      parameters:
      - name: id
        in: path
        description: Quiz id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Quiz detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQuizResponse'
        '401':
          description: Unauthorized
        '404':
          description: No such quiz
      security:
      - bearer: []
    patch:
      tags:
      - quizzes
      operationId: patch_quiz
      parameters:
      - name: id
        in: path
        description: Quiz id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizPatch'
        required: true
      responses:
        '200':
          description: Quiz updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchQuizResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: No such quiz
        '422':
          description: Validation failed
      security:
      - bearer: []
  /v1/quizzes/{id}/questions:
    post:
      tags:
      - quizzes
      operationId: add_quiz_question
      parameters:
      - name: id
        in: path
        description: Quiz id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddQuizQuestionBody'
        required: true
      responses:
        '201':
          description: Question linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddQuizQuestionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: No such quiz or question
        '422':
          description: Validation failed
      security:
      - bearer: []
  /v1/quizzes/{id}/stats:
    get:
      tags:
      - crate::http::stats
      operationId: quiz_stats
      parameters:
      - name: id
        in: path
        description: Quiz id
        required: true
        schema:
          type: string
          format: uuid
      - name: cohortId
        in: query
        description: Filter by cohort (future)
        required: false
        schema:
          type: string
          format: uuid
      - name: window
        in: query
        description: '''last30d'' | ''all'''
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Quiz stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizStatsResponse'
        '403':
          description: Requires stats.read scope
        '404':
          description: Quiz not found
      security:
      - bearer_auth: []
  /v1/sessions:
    get:
      tags:
      - crate::http::sessions
      summary: GET /v1/sessions — the caller's finished attempt history, newest first.
      operationId: list_my_sessions
      parameters:
      - name: quizId
        in: query
        description: Filter by quiz
        required: false
        schema:
          type: string
          format: uuid
      - name: examId
        in: query
        description: Filter by exam
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Attempt history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMySessionsResponse'
        '401':
          description: Unauthorized
      security:
      - bearer_auth: []
    post:
      tags:
      - crate::http::sessions
      operationId: create_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionBody'
        required: true
      responses:
        '201':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/sessions/{id}:
    get:
      tags:
      - crate::http::sessions
      operationId: get_session
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Session resume state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSessionResponse'
        '404':
          description: No such session
      security:
      - bearer_auth: []
    patch:
      tags:
      - crate::http::sessions
      operationId: patch_session
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSessionBody'
        required: true
      responses:
        '200':
          description: Session updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: No such session
      security:
      - bearer_auth: []
  /v1/sessions/{id}/answer:
    post:
      tags:
      - crate::http::sessions
      operationId: answer
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSessionBody'
        required: true
      responses:
        '200':
          description: Stored answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSessionResponse'
        '410':
          description: Session expired
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/sessions/{id}/answers:
    patch:
      tags:
      - crate::http::sessions
      operationId: autosave_answers
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Draft saved
      security:
      - bearer_auth: []
  /v1/sessions/{id}/finish:
    post:
      tags:
      - crate::http::sessions
      operationId: finish
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Finished session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishSessionResponse'
        '404':
          description: No such session
      security:
      - bearer_auth: []
  /v1/tags:
    get:
      tags:
      - crate::http::tags
      operationId: list_tags
      responses:
        '200':
          description: All tags, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
    post:
      tags:
      - crate::http::tags
      operationId: create_tag
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagBody'
        required: true
      responses:
        '201':
          description: Tag created (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
      security:
      - bearer_auth: []
