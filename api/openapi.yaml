components:
  schemas:
    ActivityEntry:
      type: object
      required:
      - id
      - ts
      - agentId
      - toolName
      - method
      - path
      - status
      properties:
        agentId:
          type: string
          format: uuid
        agentName:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        method:
          type: string
        note:
          type:
          - string
          - 'null'
        path:
          type: string
        status:
          type: integer
          format: int32
        targetId:
          type:
          - string
          - 'null'
          format: uuid
        toolName:
          type: string
        ts:
          type: string
          format: date-time
    ActivityResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEntry'
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
    AddAssessmentQuestionBody:
      type: object
      properties:
        kind:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuestionKind'
            description: Create a new question inline (kind + prompt required if question_id absent).
        pointsOverride:
          type:
          - integer
          - 'null'
          format: int32
        prompt:
          type:
          - string
          - 'null'
        questionId:
          type:
          - string
          - 'null'
          format: uuid
          description: Link an existing bank question by ID.
        sectionId:
          type:
          - string
          - 'null'
          format: uuid
          description: Target section ID (defaults to first section if absent).
    AddAssessmentQuestionResponse:
      type: object
      required:
      - questionId
      - orderIndex
      properties:
        orderIndex:
          type: integer
          format: int32
        questionId:
          type: string
          format: uuid
    AdminAssessmentDetail:
      type: object
      required:
      - id
      - title
      - status
      - mode
      - createdBy
      - objectives
      - createdAt
      - questions
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        createdByEmail:
          type:
          - string
          - 'null'
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        mode:
          type: string
        objectives:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/AdminPreviewQuestion'
        status:
          type: string
        title:
          type: string
    AdminAssessmentEntry:
      type: object
      required:
      - id
      - title
      - status
      - mode
      - createdBy
      - objectives
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        createdByEmail:
          type:
          - string
          - 'null'
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        mode:
          type: string
        objectives:
          type: array
          items:
            type: string
        status:
          type: string
        title:
          type: string
    AdminHealthResponse:
