openapi: 3.1.0
info:
  title: ame API
  description: 'Question collector + exam platform. Plan 3 surface: tags + questions CRUD with versioning.'
  license:
    name: ''
  version: 0.1.0
paths:
  /questions:
    get:
      tags:
      - crate::http::questions
      operationId: list_questions
      parameters:
      - name: tag
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: path
        required: true
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuestionStatus'
      - name: min_rating
        in: path
        required: true
        schema:
          type:
          - number
          - 'null'
          format: double
      - name: max_rating
        in: path
        required: true
        schema:
          type:
          - number
          - 'null'
          format: double
      - name: limit
        in: path
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: offset
        in: path
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Filtered list of questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionListResponse'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
    post:
      tags:
      - crate::http::questions
      operationId: create_questions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionsBody'
        required: true
      responses:
        '201':
          description: Batch of created questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateQuestionsResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '409':
          description: Idempotency key conflict
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /questions/{id}:
    get:
      tags:
      - crate::http::questions
      operationId: get_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: No such question
      security:
      - bearer_auth: []
    patch:
      tags:
      - crate::http::questions
      operationId: update_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionPatch'
        required: true
      responses:
        '200':
          description: Updated question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '404':
          description: No such question
        '422':
          description: Cannot edit archived question
      security:
      - bearer_auth: []
  /questions/{id}/archive:
    post:
      tags:
      - crate::http::questions
      operationId: archive_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: No such question
      security:
      - bearer_auth: []
  /questions/{id}/promote:
    post:
      tags:
      - crate::http::questions
      operationId: promote_question
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Question promoted to live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: No such question
      security:
      - bearer_auth: []
  /questions/{id}/versions:
    get:
      tags:
      - crate::http::questions
      operationId: list_versions
      parameters:
      - name: id
        in: path
        description: Question id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Historical versions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionVersionsResponse'
        '404':
          description: No such question
      security:
      - bearer_auth: []
  /tags:
    get:
      tags:
      - crate::http::tags
      operationId: list_tags
      responses:
        '200':
          description: All tags, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
    post:
      tags:
      - crate::http::tags
      operationId: create_tag
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagBody'
        required: true
      responses:
        '201':
          description: Tag created (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
      security:
      - bearer_auth: []
  /v1/sessions:
    post:
      tags:
      - crate::http::sessions
      operationId: create_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionBody'
        required: true
      responses:
        '201':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Token lacks required scope
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/sessions/{id}:
    get:
      tags:
      - crate::http::sessions
      operationId: get_session
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Session resume state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSessionResponse'
        '404':
          description: No such session
      security:
      - bearer_auth: []
  /v1/sessions/{id}/answer:
    post:
      tags:
      - crate::http::sessions
      operationId: answer
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSessionBody'
        required: true
      responses:
        '200':
          description: Stored answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSessionResponse'
        '410':
          description: Session expired
        '422':
          description: Validation failed
      security:
      - bearer_auth: []
  /v1/sessions/{id}/finish:
    post:
      tags:
      - crate::http::sessions
      operationId: finish
      parameters:
      - name: id
        in: path
        description: Session id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Finished session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishSessionResponse'
        '404':
          description: No such session
      security:
      - bearer_auth: []
components:
  schemas:
    AnswerSessionBody:
      type: object
      required:
      - questionId
      - response
      properties:
        questionId:
          type: string
          format: uuid
        response:
          $ref: '#/components/schemas/AttemptResponse'
        timeToAnswerMs:
          type:
          - integer
          - 'null'
          format: int32
    AnswerSessionResponse:
      type: object
      required:
      - attempt
      - grade
      - replayed
      properties:
        attempt:
          $ref: '#/components/schemas/Attempt'
        grade:
          $ref: '#/components/schemas/GradeOutcome'
        replayed:
          type: boolean
    Attempt:
      type: object
      required:
      - id
      - user_id
      - question_id
      - question_version
      - response
      - presentation
      - is_correct
      - score
      - rating_before_user_avg
      - rating_before_question
      - user_tag_deltas
      - question_delta
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        is_correct:
          type: boolean
        presentation:
          $ref: '#/components/schemas/AttemptPresentation'
        question_delta:
          type: number
          format: double
        question_id:
          type: string
          format: uuid
        question_version:
          type: integer
          format: int32
        rating_before_question:
          type: number
          format: double
        rating_before_user_avg:
          type: number
          format: double
        response:
          $ref: '#/components/schemas/AttemptResponse'
        score:
          type: number
          format: double
        session_id:
          type:
          - string
          - 'null'
          format: uuid
        time_to_answer_ms:
          type:
          - integer
          - 'null'
          format: int32
        user_id:
          type: string
          format: uuid
        user_tag_deltas:
          type: object
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
    AttemptPresentation:
      type: object
      properties:
        option_order:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
    AttemptResponse:
      oneOf:
      - type: object
        required:
        - selected_position
        properties:
          selected_position:
            type: integer
            minimum: 0
      - type: object
        required:
        - answer
        properties:
          answer:
            type: boolean
      - type: object
        required:
        - answer
        properties:
          answer:
            type: string
      - type: object
        required:
        - body
        - word_count
        properties:
          body:
            type: string
          word_count:
            type: integer
            format: int32
      - type: object
        required:
        - source
        - language
        properties:
          language:
            type: string
          source:
            type: string
    CodePayload:
      type: object
      required:
      - language
      - starter
      properties:
        exemplar:
          type:
          - string
          - 'null'
        language:
          type: string
        starter:
          type: string
        tests:
          type: array
          items:
            $ref: '#/components/schemas/CodeTest'
        time_limit_ms:
          type:
          - integer
          - 'null'
          format: int32
    CodeSnippet:
      type: object
      required:
      - language
      - body
      properties:
        body:
          type: string
        caption:
          type:
          - string
          - 'null'
        language:
          type: string
    CodeTest:
      type: object
      required:
      - name
      - body
      properties:
        body:
          type: string
        name:
          type: string
    CreateQuestionsBody:
      type: object
      required:
      - questions
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionInsert'
    CreateQuestionsResponse:
      type: object
      required:
      - questions
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    CreateSessionBody:
      type: object
      properties:
        cats:
          type: array
          items:
            type: string
        count:
          type:
          - integer
          - 'null'
          minimum: 0
        diff:
          type:
          - string
          - 'null'
        duration:
          type:
          - integer
          - 'null'
          format: int64
        examId:
          type:
          - string
          - 'null'
          format: uuid
        mode:
          type:
          - string
          - 'null'
        quizId:
          type:
          - string
          - 'null'
          format: uuid
        tags:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            $ref: '#/components/schemas/QuestionKind'
    CreateSessionResponse:
      type: object
      required:
      - sessionId
      - questions
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SessionQuestion'
        sessionId:
          type: string
          format: uuid
    CreateTagBody:
      type: object
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type: string
    EssayPayload:
      type: object
      required:
      - judge
      properties:
        judge:
          $ref: '#/components/schemas/Judge'
        min_words:
          type:
          - integer
          - 'null'
          format: int32
        rubric:
          type:
          - string
          - 'null'
    FinishSessionResponse:
      type: object
      required:
      - session
      - result
      properties:
        result:
          $ref: '#/components/schemas/SessionResult'
        session:
          $ref: '#/components/schemas/Session'
    GetSessionResponse:
      type: object
      required:
      - session
      - attempts
      properties:
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
        session:
          $ref: '#/components/schemas/Session'
    GradeOutcome:
      type: object
      required:
      - status
      - correct
      - points_awarded
      - max
      - correct_answer
      properties:
        correct:
          type: boolean
        correct_answer:
          type: object
        max:
          type: integer
          format: int32
        note:
          type:
          - string
          - 'null'
        points_awarded:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/GradeStatus'
    GradeStatus:
      type: string
      enum:
      - graded
      - pending_manual
    Judge:
      type: string
      description: |-
        Free-text judge. Only `exact` is supported in MVP; `llm` is reserved for
        the deferred LLM-as-judge feature.
      enum:
      - exact
      - manual
      - llm
    McPayload:
      type: object
      required:
      - options
      - correct_index
      properties:
        correct_index:
          type: integer
          minimum: 0
        options:
          type: array
          items:
            type: string
    Normalize:
      type: string
      description: |-
        Normalization rule applied to *both* the stored accepted answers and the
        user's response at grade time. See spec §"Normalize semantics".
      enum:
      - exact
      - case_insensitive_strip_accents
    PlanItem:
      type: object
      required:
      - question_id
      - version
      properties:
        option_order:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
        question_id:
          type: string
          format: uuid
        section:
          type:
          - string
          - 'null'
        version:
          type: integer
          format: int32
    Question:
      type: object
      required:
      - id
      - kind
      - prompt
      - payload
      - status
      - points
      - rating
      - attempts_count
      - version
      - created_by
      - created_at
      - updated_at
      properties:
        attempts_count:
          type: integer
          format: int32
        code_snippet:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CodeSnippet'
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        explanation:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/QuestionKind'
        payload:
          type: object
        points:
          type: integer
          format: int32
        prompt:
          type: string
        rating:
          type: number
          format: double
        source:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/QuestionStatus'
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
    QuestionFilter:
      type: object
      properties:
        limit:
          type: integer
          format: int64
        max_rating:
          type:
          - number
          - 'null'
          format: double
        min_rating:
          type:
          - number
          - 'null'
          format: double
        offset:
          type: integer
          format: int64
        status:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuestionStatus'
        tag:
          type:
          - string
          - 'null'
    QuestionInsert:
      type: object
      required:
      - kind
      - prompt
      - payload
      properties:
        code_snippet:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CodeSnippet'
        explanation:
          type:
          - string
          - 'null'
        kind:
          $ref: '#/components/schemas/QuestionKind'
        payload:
          type: object
        points:
          type: integer
          format: int32
        prompt:
          type: string
        source:
          type:
          - string
          - 'null'
        tags:
          type: array
          items:
            type: string
    QuestionKind:
      type: string
      enum:
      - mc
      - tf
      - short
      - essay
      - code
    QuestionListResponse:
      type: object
      required:
      - questions
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    QuestionPatch:
      type: object
      description: |-
        Partial update body for `PATCH /questions/:id`.

        Field semantics: `None` means "leave unchanged", `Some(v)` means "set to v".
        Clearing a nullable field (e.g. removing `explanation`) is not supported in
        MVP — rewrite via a new question if you need to.
      properties:
        code_snippet:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CodeSnippet'
        explanation:
          type:
          - string
          - 'null'
        payload:
          type: object
        points:
          type:
          - integer
          - 'null'
          format: int32
        prompt:
          type:
          - string
          - 'null'
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
    QuestionPlan:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanItem'
    QuestionStatus:
      type: string
      enum:
      - draft
      - live
      - archived
    QuestionVersion:
      type: object
      description: |-
        Historical snapshot of a question's editable fields, written when a `live`
        question is edited (see spec §"Versioning rule").
      required:
      - question_id
      - version
      - prompt
      - payload
      - archived_at
      properties:
        archived_at:
          type: string
          format: date-time
        code_snippet:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CodeSnippet'
        explanation:
          type:
          - string
          - 'null'
        payload:
          type: object
        prompt:
          type: string
        question_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
    QuestionVersionsResponse:
      type: object
      required:
      - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionVersion'
    Session:
      type: object
      required:
      - id
      - user_id
      - kind
      - question_plan
      - status
      - affects_rating
      - rating_snapshot
      - started_at
      properties:
        affects_rating:
          type: boolean
        deadline_at:
          type:
          - string
          - 'null'
          format: date-time
        exam_id:
          type:
          - string
          - 'null'
          format: uuid
        filter:
          type: object
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SessionKind'
        question_plan:
          $ref: '#/components/schemas/QuestionPlan'
        quiz_id:
          type:
          - string
          - 'null'
          format: uuid
        rating_snapshot:
          type: object
        result:
          type: object
        started_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SessionStatus'
        user_id:
          type: string
          format: uuid
    SessionKind:
      type: string
      enum:
      - quiz
      - exam
      - practice
    SessionQuestion:
      type: object
      required:
      - id
      - kind
      - prompt
      - version
      - points
      - payload
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/QuestionKind'
        option_order:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
        payload:
          type: object
        points:
          type: integer
          format: int32
        prompt:
          type: string
        version:
          type: integer
          format: int32
    SessionResult:
      type: object
      required:
      - points_awarded
      - max_points
      - percent
      - graded_count
      - pending_manual_count
      properties:
        graded_count:
          type: integer
          minimum: 0
        max_points:
          type: integer
          format: int32
        pending_manual_count:
          type: integer
          minimum: 0
        percent:
          type: number
          format: double
        points_awarded:
          type: integer
          format: int32
    SessionStatus:
      type: string
      enum:
      - in_progress
      - finished
      - abandoned
    ShortPayload:
      type: object
      required:
      - accepted
      - normalize
      - judge
      properties:
        accepted:
          type: array
          items:
            type: string
        judge:
          $ref: '#/components/schemas/Judge'
        normalize:
          $ref: '#/components/schemas/Normalize'
    Tag:
      type: object
      required:
      - id
      - name
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        name:
          type: string
    TfPayload:
      type: object
      required:
      - correct
      properties:
        correct:
          type: boolean
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: uuid_secret
