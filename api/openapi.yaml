          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
    AnswerSessionBody:
      type: object
      required:
      - questionId
      - response
      properties:
        questionId:
          type: string
          format: uuid
        response:
          $ref: '#/components/schemas/AttemptResponse'
        timeToAnswerMs:
          type:
          - integer
          - 'null'
          format: int32
    AnswerSessionResponse:
      type: object
      required:
      - attempt
      - grade
      - replayed
      properties:
        attempt:
          $ref: '#/components/schemas/Attempt'
        grade:
          $ref: '#/components/schemas/GradeOutcome'
        replayed:
          type: boolean
    ApiError:
      oneOf:
      - type: string
        enum:
        - Unauthorized
      - type: object
        required:
        - Forbidden
        properties:
          Forbidden:
            type: string
      - type: object
        required:
        - ScopeRequired
        properties:
          ScopeRequired:
            type: string
      - type: object
        required:
        - NotFound
        properties:
          NotFound:
            type: object
            required:
            - resource
            properties:
              resource:
                type: string
      - type: object
        required:
        - Validation
        properties:
          Validation:
            type: array
            items:
              $ref: '#/components/schemas/FieldError'
      - type: object
        required:
        - InvalidPayload
        properties:
          InvalidPayload:
            type: object
            required:
            - kind
            - reason
            properties:
              kind:
                type: string
              reason:
                type: string
      - type: object
        required:
        - ExamPoolInsufficient
        properties:
          ExamPoolInsufficient:
            type: object
            required:
            - section
            - required
            - available
            properties:
              available:
                type: integer
                minimum: 0
              required:
                type: integer
                minimum: 0
              section:
                type: string
      - type: string
        enum:
        - SessionFinished
      - type: string
        enum:
        - ExamExpired
      - type: string
        enum:
        - IdempotencyConflict
      - type: string
        enum:
        - ScoringUnavailable
      - type: string
        enum:
        - TooManyRequests
      - type: object
        required:
        - UnknownTool
        properties:
          UnknownTool:
            type: string
      - type: string
        enum:
        - Maintenance
      - type: object
        required:
        - QuotaExceeded
        properties:
          QuotaExceeded:
            type: object
            required:
            - kind
            - limit
            - usage
