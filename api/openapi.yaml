              $ref: '#/components/schemas/RegisterBody'
        required: true
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation failed
  /public/v1/catalog/journeys:
    get:
      tags:
      - onboarding
      summary: GET /public/v1/catalog/journeys — list reviewed, selectable native journeys.
      operationId: list_native_journeys
      responses:
        '200':
          description: Reviewed native journeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NativeJourneyCatalogResponse'
  /public/v1/onboarding/preview:
    post:
      tags:
      - onboarding
      summary: POST /public/v1/onboarding/preview — explain the first journey without creating state.
      operationId: preview_learning
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewLearningBody'
        required: true
      responses:
        '200':
          description: Preview of the first learning journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewLearningResponse'
        '422':
          description: Validation failed
  /public/v1/onboarding/start:
    post:
      tags:
      - onboarding
      summary: POST /public/v1/onboarding/start — create or resume a learner's first journey.
      operationId: start_learning
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartLearningBody'
        required: true
      responses:
        '201':
          description: Learner and first journey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLearningResponse'
        '401':
          description: Existing learner requires authentication
        '422':
          description: Validation failed; an existing learner must supply a valid bearer token
