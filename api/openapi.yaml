openapi: 3.1.0
info:
  title: ame API
  description: ame — an agent-friendly learning API with one owner-scoped learner model.
  license:
    name: ''
  version: 0.3.0
paths:
  /api/v1/admin/audit:
    get:
      tags:
      - admin
      summary: GET /api/v1/admin/audit — retrieve append-only audit trail logs
      operationId: list_audit_logs
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: actorId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: targetId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Audit trail successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditLogsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /api/v1/admin/health:
    get:
      tags:
      - admin
      operationId: get_admin_health
      responses:
        '200':
          description: Current platform health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealthResponse'
        '401':
          description: Unauthorized
        '403':
          description: Administrator role required
      security:
      - bearer: []
  /api/v1/admin/settings:
    get:
      tags:
      - admin
      summary: |-
        GET /api/v1/admin/settings — current effective platform settings (config
        defaults overlaid with any tb_settings overrides).
      operationId: get_settings
      responses:
        '200':
          description: Effective platform settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveSettings'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
    put:
      tags:
      - admin
      summary: |-
        PUT /v1/admin/settings — upsert one or more setting overrides. Each changed
        key is written to tb_settings, the settings cache is busted, and one audit
        row is emitted. Returns the new effective settings.
      operationId: put_settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsBody'
        required: true
      responses:
        '200':
          description: Updated effective platform settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveSettings'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /api/v1/admin/task-submissions:
    get:
      tags:
      - tasks
      operationId: list_pending_submissions
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskSubmissionResponse'
      security:
      - bearer: []
  /api/v1/admin/users:
    get:
      tags:
      - admin
      summary: GET /api/v1/admin/users — list all users
      operationId: list_users
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: User list successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
      security:
      - bearer: []
  /api/v1/admin/users/{id}:
    patch:
      tags:
      - admin
      summary: PATCH /v1/admin/users/{id} — update learner/admin role or account status
      operationId: patch_user_admin
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserAdminBody'
        required: true
      responses:
        '204':
          description: User successfully updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin required)
        '404':
          description: User not found
      security:
      - bearer: []
  /api/v1/assessments:
    get:
      tags:
      - assessments
      operationId: get_assessment_for_activity
      parameters:
      - name: activityId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Assessment attached to the activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '404':
          description: No assessment exists for this learner's activity
      security:
      - bearer: []
    post:
      tags:
      - assessments
      operationId: create_assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentBody'
        required: true
      responses:
        '200':
          description: Created assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
      security:
      - bearer: []
  /api/v1/assessments/{assessment_id}:
    get:
      tags:
      - assessments
      operationId: get_assessment
      parameters:
      - name: assessment_id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
      security:
      - bearer: []
  /api/v1/assessments/{assessment_id}/attempts:
    post:
      tags:
      - attempts
      operationId: start_attempt
      parameters:
      - name: assessment_id
        in: path
        description: Assessment ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAttemptBody'
        required: true
      responses:
        '200':
          description: Started or resumed attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
      security:
      - bearer: []
  /api/v1/attempts/{attempt_id}:
    get:
      tags:
      - attempts
      operationId: get_attempt
      parameters:
      - name: attempt_id
        in: path
        description: Attempt ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
      security:
      - bearer: []
  /api/v1/attempts/{attempt_id}/answers:
    post:
      tags:
      - attempts
      operationId: save_answer
      parameters:
      - name: attempt_id
        in: path
        description: Attempt ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAnswerBody'
        required: true
      responses:
        '200':
          description: Saved answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
      security:
      - bearer: []
  /api/v1/attempts/{attempt_id}/finish:
    post:
      tags:
      - attempts
      operationId: finish_attempt
      parameters:
      - name: attempt_id
        in: path
        description: Attempt ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Finished attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
      security:
      - bearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: POST /api/v1/auth/logout — clear the HttpOnly token cookie.
      operationId: logout
      responses:
        '200':
          description: Logged out
  /api/v1/deep-dives:
    get:
      tags:
      - deep-dives
      operationId: get_for_activity
      parameters:
      - name: activityId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Deep dive attached to the activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDiveResponse'
        '404':
          description: No deep dive exists for this learner's activity
      security:
      - bearer: []
    post:
      tags:
      - deep-dives
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeepDiveBody'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDiveResponse'
      security:
      - bearer: []
  /api/v1/deep-dives/{id}:
    get:
      tags:
      - deep-dives
      operationId: get_one
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDiveResponse'
      security:
      - bearer: []
  /api/v1/generation-runs:
    post:
      tags:
      - generation
      operationId: start
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGenerationRunBody'
        required: true
      responses:
        '201':
          description: Started or resumed a provider generation run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRunResponse'
      security:
      - bearer: []
  /api/v1/generation-runs/{id}:
    get:
      tags:
      - generation
      operationId: get_one
      parameters:
      - name: id
        in: path
        description: Generation run ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Owned provider generation run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRunResponse'
      security:
      - bearer: []
    patch:
      tags:
      - generation
      operationId: transition
      parameters:
      - name: id
        in: path
        description: Generation run ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionGenerationRunBody'
        required: true
      responses:
        '200':
          description: Transitioned owned provider generation run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRunResponse'
      security:
      - bearer: []
  /api/v1/learning/activities/{activity_id}/content:
    patch:
      tags:
      - learning
      summary: PATCH /api/v1/learning/activities/{activity_id}/content — replace an uncompleted explanation or example with reviewed agent-authored content.
      operationId: author_activity_content
      parameters:
      - name: activity_id
        in: path
        description: Activity to ground
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorActivityContentBody'
        required: true
      responses:
        '200':
          description: Grounded learner activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningActivityResponse'
        '401':
          description: Missing or invalid token
        '404':
          description: Activity or generation run does not belong to this learner
        '409':
          description: Generation is not published or activity content is immutable
        '422':
          description: Content, provenance, or review status is invalid
      security:
      - bearer_auth: []
  /api/v1/learning/activities/{activity_id}/rubric:
    patch:
      tags:
      - learning
      summary: PATCH /api/v1/learning/activities/{activity_id}/rubric — attach a reviewed, source-backed scoring rubric to a task activity.
      operationId: author_activity_rubric
      parameters:
      - name: activity_id
        in: path
        description: Task activity to attach a rubric to
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorActivityRubricBody'
        required: true
      responses:
        '200':
          description: Activity with its attached rubric
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningActivityResponse'
        '401':
          description: Missing or invalid token
        '404':
          description: Activity or generation run does not belong to this learner
        '409':
          description: Generation is not published or activity is completed
        '422':
          description: Rubric, provenance, or review status is invalid
      security:
      - bearer_auth: []
  /api/v1/learning/journeys:
    get:
      tags:
      - learning
      summary: GET /api/v1/learning/journeys — list the caller's learner-owned journeys.
      operationId: list_journeys
      responses:
        '200':
          description: Learner journeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearningJourneySummaryResponse'
        '401':
          description: Missing or invalid token
      security:
      - bearer_auth: []
  /api/v1/learning/journeys/{id}:
    get:
      tags:
      - learning
      summary: GET /api/v1/learning/journeys/{id} — retrieve the caller's resumable journey.
      operationId: get_journey
      parameters:
      - name: id
        in: path
        description: Learning journey ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Learning journey and its goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningJourneyResponse'
        '401':
          description: Missing or invalid token
        '404':
          description: Journey does not exist for this learner
      security:
      - bearer_auth: []
  /api/v1/learning/journeys/{journey_id}/activities/{activity_id}/start:
    post:
      tags:
      - learning
      summary: POST /api/v1/learning/journeys/{journey_id}/activities/{activity_id}/start — start or resume an activity session.
      operationId: start_activity
      parameters:
      - name: journey_id
        in: path
        description: Learning journey ID
        required: true
        schema:
          type: string
          format: uuid
      - name: activity_id
        in: path
        description: Learning activity ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Learning session started or resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSessionResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: The authenticated learner cannot access this resource
        '404':
          description: Activity does not exist for this learner
        '422':
          description: Activity is not ready
      security:
      - bearer_auth: []
  /api/v1/learning/journeys/{journey_id}/attempts:
    get:
      tags:
      - attempts
      operationId: list_journey_attempts
      parameters:
      - name: journey_id
        in: path
        description: Learning journey ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Attempts in the learner-owned journey
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttemptResponse'
      security:
      - bearer: []
  /api/v1/learning/sessions/{id}:
    get:
      tags:
      - learning
      summary: GET /api/v1/learning/sessions/{id} — retrieve a learner's resumable session.
      operationId: get_learning_session
      parameters:
      - name: id
        in: path
        description: Learning session ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Learning session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSessionResponse'
        '401':
          description: Missing or invalid token
        '404':
          description: Session does not exist for this learner
      security:
      - bearer_auth: []
  /api/v1/learning/sessions/{id}/finish:
    post:
      tags:
      - learning
      summary: POST /api/v1/learning/sessions/{id}/finish — finish the current learning activity.
      operationId: finish_learning_session
      parameters:
      - name: id
        in: path
        description: Learning session ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishLearningSessionBody'
        required: true
      responses:
        '200':
          description: Finished learning session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSessionResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: The authenticated learner cannot access this resource
        '404':
          description: Session does not exist for this learner
        '409':
          description: Session is already finished
      security:
      - bearer_auth: []
  /api/v1/me:
    get:
      tags:
      - me
      summary: Get the authenticated learner profile.
      operationId: get_me
      responses:
        '200':
          description: Current learner profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
      security:
      - bearer: []
  /api/v1/progress/evidence:
    post:
      tags:
      - progress
      operationId: record_evidence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceBody'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceResponse'
      security:
      - bearer: []
  /api/v1/progress/streaks:
    post:
      tags:
      - progress
      operationId: record_streak
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreakBody'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreakResponse'
      security:
      - bearer: []
  /api/v1/progress/{journey_id}/objectives/{objective_id}:
    get:
      tags:
      - progress
      operationId: snapshot
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: objective_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
      security:
      - bearer: []
  /api/v1/progress/{journey_id}/recommendation:
    post:
      tags:
      - progress
      operationId: recommend
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationBody'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
      security:
      - bearer: []
  /api/v1/progress/{journey_id}/streaks:
    get:
      tags:
      - progress
      operationId: list_streaks
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StreakResponse'
      security:
      - bearer: []
  /api/v1/progress/{journey_id}/timeline:
    get:
      tags:
      - progress
      operationId: list_timeline
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEventResponse'
      security:
      - bearer: []
  /api/v1/questions:
    post:
      tags:
      - questions
      operationId: create_question
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionBody'
        required: true
      responses:
        '200':
          description: Created question version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
      security:
      - bearer: []
  /api/v1/questions/{question_id}/versions:
    post:
      tags:
      - questions
      operationId: create_question_version
      parameters:
      - name: question_id
        in: path
        description: Question ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionBody'
        required: true
      responses:
        '200':
          description: Created question version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
      security:
      - bearer: []
  /api/v1/questions/{question_id}/versions/{version}:
    get:
      tags:
      - questions
      operationId: get_question_version
      parameters:
      - name: question_id
        in: path
        description: Question ID
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        description: Question version
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: Question version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
      security:
      - bearer: []
  /api/v1/reviews:
    post:
      tags:
      - reviews
      operationId: seed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedReviewBody'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItemResponse'
      security:
      - bearer: []
  /api/v1/reviews/due:
    get:
      tags:
      - reviews
      operationId: list_due
      parameters:
      - name: dueBefore
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewItemResponse'
      security:
      - bearer: []
  /api/v1/reviews/{review_item_id}/ratings:
    post:
      tags:
      - reviews
      operationId: rate
      parameters:
      - name: review_item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateReviewBody'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItemResponse'
      security:
      - bearer: []
  /api/v1/source-imports:
    get:
      tags:
      - sources
      operationId: list_imports
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
