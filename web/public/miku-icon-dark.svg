<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    #tailL{transform-box:fill-box;transform-origin:90% 50%;animation:swayL 3.8s ease-in-out infinite}
    #tailR{transform-box:fill-box;transform-origin:10% 50%;animation:swayR 3.8s ease-in-out infinite}
    #fig{animation:bob 3.8s ease-in-out infinite}
    #eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}
    @keyframes swayL{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(2deg)}}
    @keyframes swayR{0%,100%{transform:rotate(3.5deg)}50%{transform:rotate(-2deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
    @media (prefers-reduced-motion:reduce){#tailL,#tailR,#fig,#eyes{animation:none}}
  </style>
  <rect width="100" height="100" rx="22" fill="#0C1817"/>
  <g id="fig">
    <!-- Left Wrapper End -->
    <g id="tailL">
      <path d="M40 50 L18 32 C14 28 10 38 12 50 C10 62 14 72 18 68 Z" fill="#4FCBC0"/>
      <path d="M40 50 L22 36 C18 32 15 40 16 50 C15 60 18 68 22 64 Z" fill="#84E2D9"/>
      <path d="M34 43 Q26 40 22 50 Q26 60 34 57 Z" fill="#FF9DC0"/>
    </g>
    <!-- Right Wrapper End -->
    <g id="tailR">
      <path d="M60 50 L82 32 C86 28 90 38 88 50 C90 62 86 72 82 68 Z" fill="#4FCBC0"/>
      <path d="M60 50 L78 36 C82 32 85 40 84 50 C85 60 82 68 78 64 Z" fill="#84E2D9"/>
      <path d="M66 43 Q74 40 78 50 Q74 60 66 57 Z" fill="#FF9DC0"/>
    </g>
    <!-- Center Candy Body -->
    <circle cx="50" cy="50" r="21" fill="#000000" opacity="0.3"/>
    <circle cx="50" cy="50" r="20" fill="#84E2D9"/>
    <!-- Swirl stripe -->
    <path d="M50 30 C39 30 30 39 30 50 C30 61 39 70 50 70" fill="none" stroke="#FF9DC0" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M50 38 C43 38 38 43 38 50" fill="none" stroke="#0C1817" stroke-width="3" stroke-linecap="round"/>
    <!-- Cute Mascot Face -->
    <circle cx="44" cy="52" r="2" fill="#F7A9C4" opacity="0.9"/>
    <circle cx="56" cy="52" r="2" fill="#F7A9C4" opacity="0.9"/>
    <g id="eyes">
      <circle cx="44" cy="48" r="2.5" fill="#3E4E50"/>
      <circle cx="56" cy="48" r="2.5" fill="#3E4E50"/>
    </g>
    <path d="M47 52 Q50 55 53 52" fill="none" stroke="#3E4E50" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Glossy Highlight -->
    <circle cx="43" cy="38" r="3.5" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
