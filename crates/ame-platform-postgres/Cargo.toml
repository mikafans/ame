[package]
name = "ame-platform-postgres"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
ame-learning-postgres = { path = "../ame-learning-postgres" }
ame-learning-domain = { path = "../ame-learning-domain" }
ame-platform-application = { path = "../ame-platform-application" }
ame-platform-domain = { path = "../ame-platform-domain" }
async-trait = "0.1"
deadpool-redis = "0.18"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["v7", "v4", "serde", "js"] }
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
utoipa = { version = "5", features = ["uuid", "time", "yaml"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
