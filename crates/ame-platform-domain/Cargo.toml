[package]
name = "ame-platform-domain"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
ame-learning-domain = { path = "../ame-learning-domain" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
utoipa = { version = "5", features = ["uuid", "time"] }
uuid = { version = "1", features = ["v7", "v4", "serde", "js"] }
